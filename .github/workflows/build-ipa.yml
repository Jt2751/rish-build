name: Build AdHoc IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (for example 0.1.0)
        required: true
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: rish-adhoc-ipa
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/ZSeven-W/rish-app.git
  PIN: c740a47b61be827759c7297a5050a04b13fed069
  SRC: src

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_VERSION: ${{ inputs.version }}
      RISH_IOS_GUEST_CGI_ENABLED: '1'
    steps:
      - name: Fetch upstream source
        run: |
          set -euo pipefail
          git clone --depth 1 "$UPSTREAM" "$SRC"
          actual=$(git -C "$SRC" rev-parse HEAD)
          if [ "$actual" != "$PIN" ]; then
            echo "Upstream moved; fetching pinned commit"
            git -C "$SRC" fetch --depth 1 origin "$PIN"
            git -C "$SRC" checkout --detach "$PIN"
          fi
          git -C "$SRC" log --oneline -1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
          cache-dependency-path: src/apps/mobile/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: src/apps/mobile
      - name: Check release configuration
        run: |
          python3 - <<'PY'
          import os, re
          if not re.fullmatch(r'[0-9]{1,4}\.[0-9]{1,2}(\.[0-9]{1,2})?', os.environ['RELEASE_VERSION']):
              raise SystemExit('Invalid release version')
          PY
          xcodebuild -version
          echo "RELEASE_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.94
          source "$HOME/.cargo/env"
          rustup target add --toolchain 1.94 aarch64-apple-ios aarch64-apple-ios-sim
          rustc +1.94 -vV
      - name: Restore pinned native dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/modules/rish/ios/Vendor
            src/modules/rish/ios/include/rish.h
          key: rish-ios-arm64-xcode-26.6-v2-${{ env.PIN }}-${{ hashFiles('src/scripts/prepare-*.sh') }}
      - name: Prepare pinned native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          ./scripts/prepare-rish-ios.sh
          ./scripts/prepare-rish-agent-core.sh
          ./scripts/prepare-libgit2-ios.sh
      - name: Cache prepared native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src/modules/rish/ios/Vendor
            src/modules/rish/ios/include/rish.h
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Install JavaScript dependencies
        run: npm ci --prefix src/apps/mobile
      - name: Install Pods
        working-directory: src/apps/mobile
        run: |
          bundle exec pod install --project-directory=ios
          printf 'export NODE_BINARY=%s\n' "$(command -v node)" > ios/.xcode.env.local
      - name: Archive without signing
        working-directory: src/apps/mobile
        env:
          RELEASE_BUILD: ${{ env.RELEASE_BUILD }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Rish.xcworkspace -scheme Rish \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/.build/unsigned/Rish.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="${RELEASE_VERSION}" CURRENT_PROJECT_VERSION="${RELEASE_BUILD}" \
            archive
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app=".build/unsigned/Rish.xcarchive/Products/Applications/Rish.app"
          [[ -d "$app" ]] || { echo "missing $app"; exit 1; }
          work=$(mktemp -d)
          mkdir -p "$work/Payload"
          cp -R "$app" "$work/Payload/"
          (cd "$work" && zip -qry Rish-unsigned.ipa Payload)
          mv "$work/Rish-unsigned.ipa" "$GITHUB_WORKSPACE/.build/Rish-unsigned.ipa"
          rm -rf "$work"
          ls -la "$GITHUB_WORKSPACE/.build/Rish-unsigned.ipa"
      - name: Save IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rish-unsigned-${{ inputs.version }}-${{ env.RELEASE_BUILD }}
          path: .build/Rish-unsigned.ipa
          if-no-files-found: ignore
          retention-days: 14
